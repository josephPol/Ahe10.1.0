<!doctype html>
<html lang="en">
<head>
  <!-- Tema inicial para evitar parpadeo -->
  <script>
    // Apply theme immediately to prevent flash
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Metadatos basicos -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | AJE10</title>
  <!-- Estilos base y ajustes locales -->
  <link rel="stylesheet" href="../css/registro.css">
  <link rel="stylesheet" href="../css/cookies.css">
  <style>
    /* ESTILOS LOCALES PARA ASEGURAR QUE FUNCIONEN */
    #registerBtn {
      padding: 1.2rem 2.5rem !important;
      margin-top: 0.5rem !important;
      font-size: 1.2rem !important;
      font-weight: bold !important;
      color: #1a2528 !important;
      background: linear-gradient(180deg, #f4a460, #d48545) !important;
      border: 3px solid #8b6914 !important;
      border-radius: 6px !important;
      cursor: pointer !important;
      font-family: "Courier New", monospace !important;
      letter-spacing: 1px !important;
      transition: all 0.2s ease !important;
      box-shadow:
        0 4px 0 #6b5610,
        0 6px 12px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
      text-transform: uppercase !important;
      position: relative !important;
      top: 0 !important;
      width: 100% !important;
    }

    #registerBtn:hover:not(:disabled) {
      background: linear-gradient(180deg, #ffb575, #e59555) !important;
      box-shadow:
        0 2px 0 #6b5610,
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3) !important;
      top: 2px !important;
      transform: scale(1.02) !important;
    }

    #registerBtn:active:not(:disabled) {
      top: 4px !important;
      box-shadow:
        0 0 0 #6b5610,
        0 2px 4px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
    }

    #registerBtn:disabled {
      opacity: 0.7 !important;
      cursor: not-allowed !important;
      background: linear-gradient(180deg, #a88560, #8b6f47) !important;
    }
  </style>
</head>

<body>

<!-- Contenedor principal de registro -->
<div class="registerPage">

  <!-- Caja de registro con formulario -->
  <div class="registerBox">
    <h1>AJE10</h1>
    <p class="subtitle">Create your account to play and get benefits!</p>

    <!-- Formulario de creacion de cuenta -->
    <form id="registerForm">

      <div class="row">
        <label>
          Username
          <input type="text" id="registerName" placeholder="tuUsuario" required>
        </label>

        <label>
          Email
          <input type="email" id="registerEmail" placeholder="tu@email.com" required>
        </label>
      </div>

      <div class="row">
        <label>
          Password
          <input type="password" id="registerPassword" placeholder="••••••••" required>
        </label>

        <label>
          Confirm password
          <input type="password" id="registerPasswordConfirm" placeholder="••••••••" required>
        </label>
      </div>

      <label class="check">
        <input type="checkbox" id="registerTerms" required>
        I accept the <a href="#">terms and conditions</a>
      </label>

      <button type="submit" id="registerBtn">Create account</button>
    </form>

    <div id="registerMessage" style="margin-top: 15px; text-align: center; display: none;"></div>

    <div class="extra">
      <span>Already have an account?</span>
      <a href="login.html">Sign in</a>
    </div>

    <a href="inicio.html" class="backHome">← Home</a>
  </div>

</div>

<!-- Script de autenticacion y logica del formulario -->
<script src="../auth/auth.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const name = document.getElementById('registerName').value;
    const email = document.getElementById('registerEmail').value;
    const password = document.getElementById('registerPassword').value;
    const passwordConfirm = document.getElementById('registerPasswordConfirm').value;
    const messageDiv = document.getElementById('registerMessage');
    const registerBtn = document.getElementById('registerBtn');
    
    if (password !== passwordConfirm) {
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Passwords do not match';
      messageDiv.style.display = 'block';
      return;
    }
    
    registerBtn.disabled = true;
    registerBtn.textContent = 'Loading...';
    
    const formData = new FormData();
    formData.append('action', 'register');
    formData.append('name', name);
    formData.append('email', email);
    formData.append('password', password);
    formData.append('password_confirm', passwordConfirm);
    
    // Usar ruta relativa segura según la ubicación actual
    const authUrl = new URL('../auth/auth.php', window.location.href).toString();

    const doFetch = (url) => fetch(url, {
      method: 'POST',
      body: formData,
      credentials: 'include'
    }).then(response => {
      if (!response.ok) {
        const error = new Error(`HTTP error! status: ${response.status}`);
        error.status = response.status;
        error.url = url;
        throw error;
      }
      return response.json();
    });

    doFetch(authUrl)
    .then(data => {
      registerBtn.disabled = false;
      registerBtn.textContent = 'Create account';
      
      if (data.success) {
        messageDiv.style.color = 'green';
        messageDiv.style.background = 'rgba(76, 175, 80, 0.1)';
        messageDiv.style.border = '2px solid #4CAF50';
        messageDiv.style.padding = '1rem';
        messageDiv.style.borderRadius = '4px';
        
        let confirmHTML = `
          <strong style="font-size: 1.1rem; display: block; margin-bottom: 0.5rem;">✓ Registration successful</strong>
          <p style="margin: 0.5rem 0; font-size: 0.95rem;">We sent a confirmation link to your email.</p>
        `;
        
        // Mostrar el link de verificación para desarrollo
        if (data.verification_token) {
          confirmHTML += `
            <div style="background: rgba(0,0,0,0.2); padding: 1rem; margin-top: 1rem; border-radius: 4px;">
              <small style="display: block; margin-bottom: 0.5rem;"><strong>Verification link (dev):</strong></small>
              <a href="${data.verification_url}" style="color: #4CAF50; word-break: break-all; text-decoration: underline; font-weight: bold;">${data.verification_url}</a>
            </div>
          `;
        }
        
        confirmHTML += `<p style="margin-top: 1rem; font-size: 0.9rem; color: #666;">Check your inbox to verify your email.</p>`;
        messageDiv.innerHTML = confirmHTML;
        messageDiv.style.display = 'block';
      } else {
        messageDiv.style.color = 'red';
        messageDiv.textContent = data.message || 'Failed to create account';
        messageDiv.style.display = 'block';
      }
    })
    .catch(error => {
      registerBtn.disabled = false;
      registerBtn.textContent = 'Create account';
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Connection error: ' + error.message + '. Please try again.';
      messageDiv.style.display = 'block';
      console.error('Error completo:', error);
    });
  });
</script>
