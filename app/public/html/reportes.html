<html lang="en">
<head>
  <script>
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AJE10 - Reports</title>
  <link rel="stylesheet" href="../css/contact.css" />
  <link rel="stylesheet" href="../css/cookies.css" />
</head>
<body>
  <header class="topbar">
    <a href="inicio.html" class="brand">
      <div class="logo">♟</div>
      <div class="brandName">♟ AJE10 ♟</div>
    </a>

    <button id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

    <nav class="topnav">
      <a href="jugar.html" class="nav-link">PLAY</a>
      <a href="inicio.html" class="nav-link">HOME</a>

      <a href="contact.html" class="nav-link">CONTACT</a>
      <a href="premium.html" class="nav-link">PREMIUM</a>
    </nav>

    <div class="topRight">
      <a href="login.html" class="btn auth-btn btn-secondary">Sign In</a>
      <a href="registro.html" class="btn auth-btn btn-primary">Sign Up</a>
      <button id="theme-toggle" class="btn-theme" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="contenedor">
    <section class="hero">
      <h1>BUG REPORT SYSTEM</h1>
      <p>Report bugs or technical suggestions clearly.</p>
    </section>

    <section class="info-section" style="max-width: 700px; margin: 2rem auto;">
      <h2>🧰 Send report</h2>
      <div id="reportMessages"></div>

      <form id="reportForm" class="contact-form" method="POST" action="../contact-submit.php" style="padding: 1.5rem 0;">
        <div class="form-group">
          <label>Your email</label>
          <input name="email" type="email" placeholder="you@email.com" required>
        </div>

        <div class="form-group">
          <label>Title</label>
          <input name="subject" type="text" placeholder="Issue summary" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea name="message" placeholder="Describe the issue, steps to reproduce, and expected result." rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          SEND REPORT
        </button>
      </form>

      <a href="contact.html" class="backHome">← Back to Contact</a>
    </section>
  </main>

  <script>
    document.getElementById('reportForm').addEventListener('submit', function(e){
      e.preventDefault();
      var form = this;
      var formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          var m = document.getElementById('reportMessages');
          if (data.success) {
            m.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
            form.reset();
          } else {
            m.innerHTML = '<div class="alert alert-danger">' + (data.message || 'Error') + '</div>';
          }
        })
        .catch(function(){
          document.getElementById('reportMessages').innerHTML = '<div class="alert alert-danger">Send error</div>';
        });
    });
  </script>
