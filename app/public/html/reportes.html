        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');

    })();

  <meta charset="utf-8" />

    </a>

    <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

    </div>

  <main class="contenedor">
    <section class="hero">
      <h1>🐛 SISTEMA DE REPORTES</h1>
      <p>Reporta bugs o sugerencias técnicas de forma clara.</p>
    </section>

    <section class="info-section" style="max-width: 700px; margin: 2rem auto;">
      <h2>🧰 Enviar reporte</h2>
      <div id="reportMessages"></div>

      <form id="reportForm" class="contact-form" method="POST" action="../contact-submit.php" style="padding: 1.5rem 0;">
        <div class="form-group">
          <label>Tu email</label>
          <input name="email" type="email" placeholder="tu@email.com" required>
        </div>

        <div class="form-group">
          <label>Título</label>
          <input name="subject" type="text" placeholder="Resumen del problema" required>
        </div>

        <div class="form-group">
          <label>Descripción</label>
          <textarea name="message" placeholder="Describe el problema, pasos para reproducir y qué esperabas." rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          ▶ ENVIAR REPORTE
        </button>
      </form>

      <a href="contact.html" class="backHome">← Volver a Contacto</a>
    </section>
  </main>

  <script>
    document.getElementById('reportForm').addEventListener('submit', function(e){
      e.preventDefault();
      var form = this;
      var formData = new FormData(form);
      fetch(form.action, {
        method: 'POST',
        body: formData
      })
        .then(function(r){ return r.json(); })
        .then(function(data){
          var m = document.getElementById('reportMessages');
          if (data.success) {
            m.innerHTML = '<div class="alert alert-success">' + data.message + '</div>';
            form.reset();
          } else {
            m.innerHTML = '<div class="alert alert-danger">' + (data.message || 'Error') + '</div>';
          }
        })
        .catch(function(){
          document.getElementById('reportMessages').innerHTML = '<div class="alert alert-danger">Error de envío</div>';
        });
    });
  </script>
