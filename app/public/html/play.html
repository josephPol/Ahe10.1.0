<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Tema inicial para evitar parpadeo -->
  <script>
    // Apply theme immediately to prevent flash
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Metadatos basicos -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Estilos base y del tablero -->
  <link rel="stylesheet" href="../css/play.css" />
  <link rel="stylesheet" href="../css/cookies.css" />

  <!-- Librerías del tablero (como en jugar.html) -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>

    </div>
  </header>

  <!-- Contenido principal de la pagina -->

      <div style="display:flex; gap:2rem; justify-content:center; margin-top:2.5rem;">
        <a href="jugar_local.html" class="result-btn" style="font-size:1.2rem; min-width:180px; text-align:center;">Jugar local</a>

    </section>

        <p>&copy; 2026 AJE10</p>

      </div>

  <!-- Scripts comunes -->
  <script src="../auth/auth.js"></script>

    <!-- Modal de seleccion de dificultad IA -->
