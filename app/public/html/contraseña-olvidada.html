<!doctype html>
<html lang="es">
<head>
  <!-- Tema inicial para evitar parpadeo -->
  <script>
    // Apply theme immediately to prevent flash
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Metadatos basicos -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar Contraseña | AJE10</title>
  <!-- Estilos base y ajustes locales -->
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/cookies.css">
  <style>
    .resetBox {
      max-width: 400px;
      background: var(--c1);
      border: 4px solid var(--c3);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.3),
        0 4px 0 var(--c2),
        0 8px 16px rgba(0,0,0,0.4);
    }

    .resetBox h1 {
      font-size: 2rem;
      color: var(--c5);
      text-align: center;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 var(--c2);
    }

    .resetBox .subtitle {
      text-align: center;
      color: var(--c4);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .resetBox .info-box {
      background: var(--c2);
      border: 2px solid var(--c3);
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--c4);
      line-height: 1.6;
    }

    .resetBox label {
      display: block;
      margin-bottom: 1.2rem;
      color: var(--c4);
      font-weight: bold;
    }

    .resetBox input {
      width: 100%;
      padding: 0.75rem;
      border: 3px solid var(--c3);
      border-radius: 4px;
      background: var(--c2);
      color: var(--c4);
      font-family: "Courier New", monospace;
      font-size: 1rem;
      margin-top: 0.5rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    .resetBox input:focus {
      outline: none;
      border-color: var(--c5);
      box-shadow: 
        inset 0 2px 4px rgba(0,0,0,0.2),
        0 0 8px rgba(100,200,255,0.5);
    }

    #resetBtn {
      padding: 1.2rem 2.5rem !important;
      margin-top: 0.5rem !important;
      font-size: 1.2rem !important;
      font-weight: bold !important;
      color: #1a2528 !important;
      background: linear-gradient(180deg, #f4a460, #d48545) !important;
      border: 3px solid #8b6914 !important;
      border-radius: 6px !important;
      cursor: pointer !important;
      font-family: "Courier New", monospace !important;
      letter-spacing: 1px !important;
      transition: all 0.2s ease !important;
      box-shadow: 
        0 4px 0 #6b5610,
        0 6px 12px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
      text-transform: uppercase !important;
      position: relative !important;
      top: 0 !important;
      width: 100% !important;
    }

    #resetBtn:hover:not(:disabled) {
      background: linear-gradient(180deg, #ffb575, #e59555) !important;
      box-shadow: 
        0 2px 0 #6b5610,
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3) !important;
      top: 2px !important;
      transform: scale(1.02) !important;
    }

    #resetBtn:active:not(:disabled) {
      top: 4px !important;
      box-shadow: 
        0 0 0 #6b5610,
        0 2px 4px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
    }

    #resetBtn:disabled {
      opacity: 0.7 !important;
      cursor: not-allowed !important;
      background: linear-gradient(180deg, #a88560, #8b6f47) !important;
    }

    .resetBox .extra {
      text-align: center;
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .resetBox .extra a {
      color: var(--c5);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .resetBox .extra a:hover {
      color: var(--c4);
      text-decoration: underline;
    }

    #resetMessage {
      margin-top: 15px;
      text-align: center;
      padding: 1rem;
      border-radius: 4px;
      font-weight: bold;
    }

    .resetBox .backHome {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--c4);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .resetBox .backHome:hover {
      color: var(--c5);
    }

    .success-icon {
      text-align: center;
      font-size: 3rem;
      margin: 1rem 0;
    }
  </style>
</head>

<body>

<!-- Encabezado simple con volver y tema -->
<header class="topbar">
  <div class="brand">
    <div class="logo">♟</div>
    <div class="brandName">AJE10</div>
  </div>

  <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>

  <nav class="topnav">
    <a href="jugar.html" class="nav-link">⚔ JUGAR</a>
    <a href="inicio.html" class="nav-link">🏠 INICIO</a>
    <a href="learn.html" class="nav-link">📚 APRENDER</a>
    <a href="contact.html" class="nav-link">💬 CONTACTO</a>
  </nav>

  <div class="topRight">
    <a href="inicio.html" class="btn auth-btn btn-secondary">← Volver</a>
    <button id="theme-toggle" class="btn-theme" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<!-- Contenedor principal de recuperacion -->
<div class="loginPage">

  <!-- Caja de recuperacion con formulario -->
  <div class="resetBox">
    <h1>🔐 Recuperar</h1>
    <p class="subtitle">Acceso a tu cuenta</p>

    <div class="info-box">
      💡 Ingresa tu email y te enviaremos instrucciones para recuperar tu contraseña.
    </div>

    <!-- Formulario de recuperacion por email -->
    <form id="resetForm">
      <label>
        Email
        <input type="email" id="resetEmail" placeholder="tu@email.com" required>
      </label>

      <button type="submit" id="resetBtn">Enviar</button>
    </form>

    <div id="resetMessage" style="display: none;"></div>

    <div class="extra">
      <a href="login.html">← Volver a Login</a>
      <a href="registro.html">Crear Cuenta →</a>
    </div>

    <a href="inicio.html" class="backHome">← Inicio</a>
  </div>

</div>

<!-- Scripts de utilidades y logica del formulario -->
<script src="../js/utils.js"></script>
<script src="js/theme.js"></script>
<script>
  document.getElementById('resetForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('resetEmail').value;
    const messageDiv = document.getElementById('resetMessage');
    const resetBtn = document.getElementById('resetBtn');
    
    resetBtn.disabled = true;
    resetBtn.textContent = 'Enviando...';
    
    const formData = new FormData();
    formData.append('action', 'request-password-reset');
    formData.append('email', email);
    
    const authUrl = new URL('../auth/auth.php', window.location.href).toString();

    fetch(authUrl, {
      method: 'POST',
      body: formData,
      credentials: 'include'
    })
    .then(response => response.json())
    .then(data => {
      resetBtn.disabled = false;
      resetBtn.textContent = 'Enviar';
      
      messageDiv.style.display = 'block';
      messageDiv.style.background = 'var(--c2)';
      messageDiv.style.border = '3px solid var(--c3)';
      messageDiv.style.color = '#4CAF50';
      
      if (data.success) {
        // Mostrar el link de reseteo para desarrollo
        let linkHTML = `
          <div class="success-icon">✓</div>
          <strong>¡Email enviado!</strong><br>
          <small style="font-size: 0.8rem; margin-top: 1rem; display: block; color: var(--c4);">
            Revisa tu bandeja de entrada (y spam) para las instrucciones.
          </small>
        `;
        
        // Si viene el token en desarrollo, mostrarlo
        if (data.reset_token) {
          linkHTML += `
            <div style="background: var(--c1); padding: 1rem; margin-top: 1rem; border-radius: 4px; border: 1px solid var(--c3);">
              <small style="color: var(--c4); display: block; margin-bottom: 0.5rem;">Link de reseteo (desarrollo):</small>
              <a href="${data.reset_url}" style="color: var(--c5); word-break: break-all; text-decoration: underline;">${data.reset_url}</a>
            </div>
          `;
        }
        
        messageDiv.innerHTML = linkHTML;
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 5000);
      } else {
        messageDiv.style.color = '#dc3545';
        messageDiv.innerHTML = `
          <div style="font-size: 2rem; margin: 1rem 0;">❌</div>
          <strong>${data.message || 'Error al procesar solicitud'}</strong>
        `;
      }
    })
    .catch(error => {
      resetBtn.disabled = false;
      resetBtn.textContent = 'Enviar';
      messageDiv.style.display = 'block';
      messageDiv.style.background = 'var(--c2)';
      messageDiv.style.border = '3px solid var(--c3)';
      messageDiv.style.color = '#dc3545';
      messageDiv.innerHTML = `
        <div style="font-size: 2rem; margin: 1rem 0;">❌</div>
        <strong>Error de conexión</strong><br>
        <small style="color: var(--c4);">Por favor, intenta nuevamente.</small>
      `;
      console.error('Error:', error);
    });
  });
</script>

<script src="../js/utils.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/cookies.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
