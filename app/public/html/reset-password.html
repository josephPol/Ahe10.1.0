<!doctype html>
<html lang="en">
<head>
  <!-- Tema inicial para evitar parpadeo -->
  <script>
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | AJE10</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/cookies.css">
  <style>
    .resetBox {
      max-width: 400px;
      background: var(--c1);
      border: 4px solid var(--c3);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.3),
        0 4px 0 var(--c2),
        0 8px 16px rgba(0,0,0,0.4);
    }

    .resetBox h1 {
      font-size: 2rem;
      color: var(--c5);
      text-align: center;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 var(--c2);
    }

    .resetBox .subtitle {
      text-align: center;
      color: var(--c4);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .resetBox .info-box {
      background: var(--c2);
      border: 2px solid var(--c3);
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--c4);
      line-height: 1.6;
    }

    .resetBox label {
      display: block;
      margin-bottom: 1.2rem;
      color: var(--c4);
      font-weight: bold;
    }

    .resetBox input {
      width: 100%;
      padding: 0.75rem;
      border: 3px solid var(--c3);
      border-radius: 4px;
      background: var(--c2);
      color: var(--c4);
      font-family: "Courier New", monospace;
      font-size: 1rem;
      margin-top: 0.5rem;
      box-sizing: border-box;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }

    .resetBox input:focus {
      outline: none;
      border-color: var(--c5);
      box-shadow: 
        inset 0 2px 4px rgba(0,0,0,0.2),
        0 0 8px rgba(100,200,255,0.5);
    }

    #resetBtn {
      padding: 1.2rem 2.5rem !important;
      margin-top: 0.5rem !important;
      font-size: 1.2rem !important;
      font-weight: bold !important;
      color: #1a2528 !important;
      background: linear-gradient(180deg, #f4a460, #d48545) !important;
      border: 3px solid #8b6914 !important;
      border-radius: 6px !important;
      cursor: pointer !important;
      font-family: "Courier New", monospace !important;
      letter-spacing: 1px !important;
      transition: all 0.2s ease !important;
      box-shadow: 
        0 4px 0 #6b5610,
        0 6px 12px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
      text-transform: uppercase !important;
      position: relative !important;
      top: 0 !important;
      width: 100% !important;
    }

    #resetBtn:hover:not(:disabled) {
      background: linear-gradient(180deg, #ffb575, #e59555) !important;
      box-shadow: 
        0 2px 0 #6b5610,
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3) !important;
      top: 2px !important;
      transform: scale(1.02) !important;
    }

    #resetBtn:active:not(:disabled) {
      top: 4px !important;
      box-shadow: 
        0 0 0 #6b5610,
        0 2px 4px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
    }

    #resetBtn:disabled {
      opacity: 0.7 !important;
      cursor: not-allowed !important;
      background: linear-gradient(180deg, #a88560, #8b6f47) !important;
    }

    .resetBox .extra {
      text-align: center;
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .resetBox .extra a {
      color: var(--c5);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .resetBox .extra a:hover {
      color: var(--c4);
      text-decoration: underline;
    }

    #resetMessage {
      margin-top: 15px;
      text-align: center;
      padding: 1rem;
      border-radius: 4px;
      font-weight: bold;
    }

    .resetBox .backHome {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--c4);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .resetBox .backHome:hover {
      color: var(--c5);
    }

    .success-icon {
      text-align: center;
      font-size: 3rem;
      margin: 1rem 0;
    }

    .error-message {
      background: rgba(220, 53, 69, 0.1);
      border: 2px solid #dc3545;
      color: #dc3545;
      padding: 1rem;
      border-radius: 4px;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>

<body>

<!-- Encabezado simple con volver y tema -->
<header class="topbar">
  <div class="brand">
    <div class="logo">♟</div>
    <div class="brandName">♟ AJE10 ♟</div>
  </div>

  <button id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

  <nav class="topnav">
    <a href="jugar.html" class="nav-link">PLAY</a>
    <a href="inicio.html" class="nav-link">HOME</a>
    <a href="learn.html" class="nav-link">LEARN</a>
    <a href="contact.html" class="nav-link">CONTACT</a>
  </nav>

  <div class="topRight">
    <a href="inicio.html" class="btn auth-btn btn-secondary">← Back</a>
    <button id="theme-toggle" class="btn-theme" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<!-- Contenedor principal de reseteo -->
<div class="loginPage">

  <!-- Caja de reseteo con formulario -->
  <div class="resetBox">
    <h1>New Password</h1>
    <p class="subtitle">Enter your new password</p>

    <div id="errorMessage" class="error-message" style="display: none;"></div>

    <!-- Formulario de reseteo de contraseña -->
    <form id="resetForm">
      <label>
        New Password
        <input type="password" id="resetPassword" placeholder="••••••••" required minlength="8">
      </label>

      <label>
        Confirm Password
        <input type="password" id="resetPasswordConfirm" placeholder="••••••••" required minlength="8">
      </label>

      <button type="submit" id="resetBtn">Update Password</button>
    </form>

    <div id="resetMessage" style="display: none;"></div>

    <div class="extra">
      <a href="login.html">← Back to Login</a>
      <a href="registro.html">Create Account →</a>
    </div>

    <a href="inicio.html" class="backHome">← Home</a>
  </div>

</div>

<!-- Scripts de utilidades y logica del formulario -->
<script src="../js/utils.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/cookies.js"></script>
<script src="../js/theme.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const errorDiv = document.getElementById('errorMessage');

    if (!token) {
      errorDiv.textContent = 'Invalid or missing token. Please request a new recovery link.';
      errorDiv.style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
      return;
    }

    document.getElementById('resetForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const password = document.getElementById('resetPassword').value;
      const passwordConfirm = document.getElementById('resetPasswordConfirm').value;
      const messageDiv = document.getElementById('resetMessage');
      const resetBtn = document.getElementById('resetBtn');
      
      // Validation
      if (password !== passwordConfirm) {
        errorDiv.textContent = 'Passwords do not match';
        errorDiv.style.display = 'block';
        return;
      }

      if (password.length < 8) {
        errorDiv.textContent = 'Password must be at least 8 characters';
        errorDiv.style.display = 'block';
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Updating...';
      errorDiv.style.display = 'none';
      
      const formData = new FormData();
      formData.append('action', 'reset-password');
      formData.append('token', token);
      formData.append('password', password);
      formData.append('password_confirm', passwordConfirm);
      
      const authUrl = new URL('../auth/auth.php', window.location.href).toString();

      fetch(authUrl, {
        method: 'POST',
        body: formData,
        credentials: 'include'
      })
      .then(response => response.json())
      .then(data => {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Update Password';
        
        if (data.success) {
          messageDiv.style.display = 'block';
          messageDiv.style.background = 'var(--c2)';
          messageDiv.style.border = '3px solid var(--c3)';
          messageDiv.style.color = '#4CAF50';
          messageDiv.innerHTML = `
            <div class="success-icon">✓</div>
            <strong>Password updated!</strong><br>
            Redirecting to sign in...
          `;
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3000);
        } else {
          errorDiv.textContent = (data.message || 'Failed to update password');
          errorDiv.style.display = 'block';
        }
      })
      .catch(error => {
        resetBtn.disabled = false;
        resetBtn.textContent = 'Update Password';
        console.error('Error:', error);
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.style.display = 'block';
      });
    });
  });
</script>

</body>
</html>
