<!doctype html>
<html lang="en">
<head>
  <!-- Tema inicial para evitar parpadeo -->
  <script>
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm Email | AJE10</title>
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/cookies.css">
  <style>
    .resetBox {
      max-width: 400px;
      background: var(--c1);
      border: 4px solid var(--c3);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: 
        inset 0 2px 8px rgba(0,0,0,0.3),
        0 4px 0 var(--c2),
        0 8px 16px rgba(0,0,0,0.4);
    }

    .resetBox h1 {
      font-size: 2rem;
      color: var(--c5);
      text-align: center;
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 var(--c2);
    }

    .resetBox .subtitle {
      text-align: center;
      color: var(--c4);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .resetBox .info-box {
      background: var(--c2);
      border: 2px solid var(--c3);
      border-radius: 4px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--c4);
      line-height: 1.6;
      text-align: center;
    }

    .resetBox .extra {
      text-align: center;
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .resetBox .extra a {
      color: var(--c5);
      text-decoration: none;
      font-weight: bold;
      transition: all 0.2s ease;
      font-size: 0.9rem;
    }

    .resetBox .extra a:hover {
      color: var(--c4);
      text-decoration: underline;
    }

    .resetBox .backHome {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--c4);
      text-decoration: none;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .resetBox .backHome:hover {
      color: var(--c5);
    }

    .success-icon {
      text-align: center;
      font-size: 3rem;
      margin: 1rem 0;
    }

    .error-icon {
      text-align: center;
      font-size: 3rem;
      margin: 1rem 0;
    }

    .spinner {
      border: 4px solid var(--c3);
      border-top: 4px solid var(--c5);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<!-- Encabezado simple con volver y tema -->
<header class="topbar">
  <div class="brand">
    <div class="logo">♟</div>
    <div class="brandName">AJE10</div>
  </div>

  <button id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

  <nav class="topnav">
    <a href="jugar.html" class="nav-link">PLAY</a>
    <a href="inicio.html" class="nav-link">HOME</a>
    <a href="learn.html" class="nav-link">LEARN</a>
    <a href="contact.html" class="nav-link">CONTACT</a>
  </nav>

  <div class="topRight">
    <a href="inicio.html" class="btn auth-btn btn-secondary">← Back</a>
    <button id="theme-toggle" class="btn-theme" aria-label="Toggle theme">🌙</button>
  </div>
</header>

<!-- Contenedor principal de verificación -->
<div class="loginPage">

  <!-- Caja de verificación -->
  <div class="resetBox">
    <h1>Confirm Email</h1>
    <p class="subtitle">Verifying your email...</p>

    <div id="content">
      <div class="spinner"></div>
      <p style="text-align: center; color: var(--c4);">One moment, please...</p>
    </div>

    <div class="extra" style="margin-top: 2rem;">
      <a href="login.html">← Back to Login</a>
      <a href="registro.html">Create Account →</a>
    </div>

    <a href="inicio.html" class="backHome">← Home</a>
  </div>

</div>

<!-- Scripts -->
<script src="../js/utils.js"></script>
<script src="../js/menu.js"></script>
<script src="../js/cookies.js"></script>
<script src="../js/theme.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const contentDiv = document.getElementById('content');

    if (!token) {
      contentDiv.innerHTML = `
        <div class="error-icon"></div>
        <p style="text-align: center; color: #dc3545;"><strong>Invalid or missing token</strong></p>
        <p style="text-align: center; color: var(--c4); font-size: 0.9rem;">Please check the link you received in your email.</p>
      `;
      return;
    }

    // Send request to verify email
    const formData = new FormData();
    formData.append('action', 'verify-email');
    formData.append('token', token);
    
    const authUrl = new URL('../auth/auth.php', window.location.href).toString();

    fetch(authUrl, {
      method: 'POST',
      body: formData,
      credentials: 'include'
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        contentDiv.innerHTML = `
          <div class="success-icon"></div>
          <p style="text-align: center; color: #4CAF50;"><strong>Email verified!</strong></p>
          <p style="text-align: center; color: var(--c4); font-size: 0.9rem;">You can sign in now. Redirecting to login...</p>
        `;
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 3000);
      } else {
        contentDiv.innerHTML = `
          <div class="error-icon"></div>
          <p style="text-align: center; color: #dc3545;"><strong>Verification error</strong></p>
          <p style="text-align: center; color: var(--c4); font-size: 0.9rem;">${data.message || 'The token may have expired.'}</p>
        `;
      }
    })
    .catch(error => {
      console.error('Error:', error);
      contentDiv.innerHTML = `
        <div class="error-icon"></div>
        <p style="text-align: center; color: #dc3545;"><strong>Connection error</strong></p>
        <p style="text-align: center; color: var(--c4); font-size: 0.9rem;">Please try again.</p>
      `;
    });
  });
</script>

</body>
</html>
