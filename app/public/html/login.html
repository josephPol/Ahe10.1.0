<!doctype html>
<html lang="en">
<head>
  <!-- Tema inicial para evitar parpadeo -->
  <script>
    // Apply theme immediately to prevent flash
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <!-- Metadatos basicos -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Estilos base y ajustes locales -->
  <link rel="stylesheet" href="../css/login.css">
  <link rel="stylesheet" href="../css/cookies.css">
  <style>
    /* ESTILOS LOCALES PARA ASEGURAR QUE FUNCIONEN */
    #loginBtn {
      padding: 1.2rem 2.5rem !important;
      margin-top: 0.5rem !important;
      font-size: 1.2rem !important;
      font-weight: bold !important;
      color: #1a2528 !important;
      background: linear-gradient(180deg, #f4a460, #d48545) !important;
      border: 3px solid #8b6914 !important;
      border-radius: 6px !important;
      cursor: pointer !important;
      font-family: "Courier New", monospace !important;
      letter-spacing: 1px !important;
      transition: all 0.2s ease !important;
      box-shadow: 
        0 4px 0 #6b5610,
        0 6px 12px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
      text-transform: uppercase !important;
      position: relative !important;
      top: 0 !important;
      width: 100% !important;
    }

    #loginBtn:hover:not(:disabled) {
      background: linear-gradient(180deg, #ffb575, #e59555) !important;
      box-shadow: 
        0 2px 0 #6b5610,
        0 4px 8px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.3) !important;
      top: 2px !important;
      transform: scale(1.02) !important;
    }

    #loginBtn:active:not(:disabled) {
      top: 4px !important;
      box-shadow: 
        0 0 0 #6b5610,
        0 2px 4px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.2) !important;
    }

    #loginBtn:disabled {
      opacity: 0.7 !important;
      cursor: not-allowed !important;
      background: linear-gradient(180deg, #a88560, #8b6f47) !important;
    }
  </style>
</head>

<!-- Contenedor principal de login -->
<div class="loginPage">

  <!-- Caja de login con formulario -->
  <div class="loginBox">
    <h1>AJE10</h1>
    <p class="subtitle">Sign in to play</p>

    <!-- Formulario de inicio de sesion -->
    <form id="loginForm">
      <label>
        Email
        <input type="email" id="loginEmail" placeholder="tu@email.com" required>
      </label>

      <label>
        Password
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </label>

      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <div id="loginMessage" style="margin-top: 15px; text-align: center; display: none;"></div>

    <div class="extra">
      <a href="registro.html">Create account</a>

  </div>

</div>

<!-- Script de autenticacion y logica del formulario -->
<script src="../auth/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const messageDiv = document.getElementById('loginMessage');
    const loginBtn = document.getElementById('loginBtn');
    
    loginBtn.disabled = true;
    loginBtn.textContent = 'Loading...';
    
    const formData = new FormData();
    formData.append('action', 'login');
    formData.append('email', email);
    formData.append('password', password);
    
    // Usar ruta relativa segura según la ubicación actual
    const authUrl = new URL('../auth/auth.php', window.location.href).toString();

    const doFetch = (url) => fetch(url, {
      method: 'POST',
      body: formData,
      credentials: 'include'
    }).then(response => {
      if (!response.ok) {
        const error = new Error(`HTTP error! status: ${response.status}`);
        error.status = response.status;
        error.url = url;
        throw error;
      }
      return response.json();
    });

    doFetch(authUrl)
    .then(data => {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      
      if (data.success) {
        messageDiv.style.color = 'green';
        messageDiv.textContent = 'Signing in...';
        messageDiv.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'inicio.html';
        }, 1500);
      } else {
        messageDiv.style.color = 'red';
        messageDiv.style.background = 'rgba(220, 53, 69, 0.1)';
        messageDiv.style.border = '2px solid #dc3545';
        messageDiv.style.padding = '0.75rem';
        messageDiv.style.borderRadius = '4px';
        let message = data.message || 'Sign in failed';
        
        // Si el error es por email no verificado, mostrar opción
        if (message.toLowerCase().includes('verifica') || message.toLowerCase().includes('verify')) {
          messageDiv.innerHTML = `<strong>${message}</strong><br><small style="margin-top: 0.5rem; display: block;"><a href="contraseña-olvidada.html" style="color: #dc3545;">Didn't get the email?</a></small>`;
        } else {
          messageDiv.textContent = message;
        }
        messageDiv.style.display = 'block';
      }
    })
    .catch(error => {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Sign In';
      messageDiv.style.color = 'red';
      messageDiv.textContent = 'Connection error: ' + error.message + '. Please try again.';
      messageDiv.style.display = 'block';
      console.error('Error completo:', error);
    });
  });
</script>
