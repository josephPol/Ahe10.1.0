<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      const theme = localStorage.getItem('chesshub_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if(theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | AJE10</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/cookies.css">
</head>
<body>
  <header class="topbar">
    <a href="inicio.html" class="brand">
      <div class="logo">♟</div>
      <div class="brandName">♟ AJE10 ♟</div>
    </a>

    <button id="menuToggle" class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button>

    <nav class="topnav">
      <a href="jugar.html" class="nav-link">PLAY</a>
      <a href="inicio.html" class="nav-link">HOME</a>
      <a href="learn.html" class="nav-link">LEARN</a>
      <a href="contact.html" class="nav-link">CONTACT</a>
      <a href="premium.html" class="nav-link">💎 PREMIUM</a>
    </nav>

    <div class="topRight">
      <a href="login.html" class="btn auth-btn btn-secondary">Sign In</a>
      <a href="registro.html" class="btn auth-btn btn-primary">Sign Up</a>
      <button id="theme-toggle" class="btn-theme" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="admin-container">
    <section class="admin-hero">
      <h1>Admin Panel</h1>
      <p>Manage users: create, edit, delete, reset passwords, and roles.</p>
      <div class="admin-actions">
        <button id="refreshBtn" class="btn btn-primary">Refresh</button>
        <button id="createBtn" class="btn btn-secondary">Create user</button>
      </div>
    </section>

    <section class="admin-table-section">
      <div id="adminMessage" class="admin-message" role="alert"></div>
      <div class="admin-table">
        <div class="admin-table-header">
          <div>ID</div>
          <div>Name</div>
          <div>Email</div>
          <div>Admin</div>
          <div>Actions</div>
        </div>
        <div id="usersList" class="admin-table-body">
          <div class="admin-loading">Loading users...</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span class="footer-icon"></span>
        <span class="footer-name">AJE10</span>
      </div>
      <div class="footer-links">
        <a href="jugar.html">Play</a>
        <a href="learn.html">Learn</a>
        <a href="contact.html">Contact</a>
        <a href="sobre-nosotros.html">About Us</a>
      </div>
      <div class="footer-copy">
        <p>&copy; 2026 AJE10</p>
        <p class="footer-slogan">♔ Play · Learn · Master ♔</p>
      </div>
    </div>
  </footer>

  <div id="adminModal" class="admin-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="admin-modal-content">
      <div class="admin-modal-header">
        <h2 id="adminModalTitle">Action</h2>
        <button id="adminModalClose" class="admin-modal-close" aria-label="Close">✕</button>
      </div>
      <div id="adminModalBody" class="admin-modal-body"></div>
      <div class="admin-modal-footer">
        <button id="adminModalCancel" class="btn-admin secondary">Cancel</button>
        <button id="adminModalSubmit" class="btn-admin">Confirm</button>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../auth/auth.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/cookies.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
